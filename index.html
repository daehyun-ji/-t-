<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 압박 면접관 - 개인화 서비스</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ⚠️ 1. 여기에 본인의 Firebase 설정값을 붙여넣으세요!
    const firebaseConfig = {
      apiKey: "AIzaSyDicqUuRCRdxuQQtmLeYPEpOIQAIN7sYZ8",
      authDomain: "bigdata-real.firebaseapp.com",
      databaseURL: "https://bigdata-real-default-rtdb.firebaseio.com",
      projectId: "bigdata-real",
      storageBucket: "bigdata-real.firebasestorage.app",
      messagingSenderId: "207202321481",
      appId: "1:207202321481:web:6b1e8e4aa447599a20eb98",
      measurementId: "G-FJZPE2XQFC"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ⚠️ 2. 본인의 앱스 스크립트 URL
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwBRFDbvjBdOV604FWuY__3qnSwUmgqdZEWa58ei9c_u2HW00GfMAdmesecI8H9DyKk/exec';

    /* --- 전역 변수 --- */
    let currentUser = null;
    let interviewHistory = [];
    let currentTurn = 1;
    const maxTurn = 3;

    /* --- DOM 요소 --- */
    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');
    const historySection = document.getElementById('historySection');
    const emailInput = document.getElementById('emailInput');
    const pwInput = document.getElementById('pwInput');
    const userEmailSpan = document.getElementById('userEmail');

    /* --- 초기 실행: 로그인 상태 체크 --- */
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authSection.classList.add('hidden');
        mainSection.classList.remove('hidden');
        userEmailSpan.textContent = user.email;
        loadHistory();
      } else {
        currentUser = null;
        authSection.classList.remove('hidden');
        mainSection.classList.add('hidden');
      }
    });

    /* --- 기능: 로그인 / 회원가입 --- */
    window.handleLogin = async () => {
      try {
        await signInWithEmailAndPassword(auth, emailInput.value, pwInput.value);
      } catch (e) { alert("로그인 실패: " + e.message); }
    };

    window.handleSignup = async () => {
      try {
        await createUserWithEmailAndPassword(auth, emailInput.value, pwInput.value);
        alert("회원가입 완료!");
      } catch (e) { alert("회원가입 실패: " + e.message); }
    };

    window.handleLogout = () => signOut(auth);

    /* --- 기능: 데이터베이스 저장 --- */
    async function saveInterviewResult(target, finalFeedback) {
      if (!currentUser) return;
      try {
        await addDoc(collection(db, "interviews"), {
          uid: currentUser.uid,
          target: target,
          feedback: finalFeedback,
          timestamp: new Date(),
          score: extractScore(finalFeedback) // 피드백 텍스트에서 점수 추출 (간단 로직)
        });
        alert("결과가 데이터베이스에 안전하게 저장되었습니다.");
        loadHistory();
      } catch (e) { console.error("Error adding document: ", e); }
    }

    // 피드백 텍스트에서 [최종 면접 점수: 85점] 형태를 찾아 숫자를 뽑는 함수
    function extractScore(text) {
      const match = text.match(/점수:\s*(\d+)/);
      return match ? parseInt(match[1]) : 0;
    }

    /* --- 기능: 내 기록 불러오기 --- */
    async function loadHistory() {
      const q = query(collection(db, "interviews"), where("uid", "==", currentUser.uid), orderBy("timestamp", "desc"));
      const querySnapshot = await getDocs(q);
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';
      
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const date = data.timestamp.toDate().toLocaleDateString();
        const li = document.createElement('div');
        li.className = 'history-item';
        li.innerHTML = `<strong>[${date}] ${data.target}</strong> - 점수: ${data.score}점 <br> <small>${data.feedback.substring(0, 100)}...</small>`;
        historyList.appendChild(li);
      });
    }

    // --- 면접 로직 연동 (이전 답변 코드와 병합) ---
    // (이하 코드들은 이전 답변의 startInterview, fetchQuestion 등을 함수 형태로 포함)
    // ... [중략: 이전 단계에서 완성한 AI 면접 로직을 이곳에 붙여넣습니다] ...
    // 단, finishInterview() 끝부분에서 saveInterviewResult()를 호출하도록 수정하세요.
  </script>
  
  <style>
    /* 전문적인 느낌의 추가 스타일 */
    .hidden { display: none; }
    .history-item { padding: 15px; border-bottom: 1px solid #eee; background: #fff; margin-bottom: 5px; border-radius: 8px; }
    .auth-box { max-width: 400px; margin: 100px auto; padding: 30px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    input { width: 100%; margin-bottom: 10px; padding: 12px; border-radius: 8px; border: 1px solid #ddd; }
    .btn { cursor: pointer; padding: 12px; background: #1e3c72; color: white; border: none; border-radius: 8px; width: 100%; }
  </style>
</head>
<body>
  <div id="authSection" class="auth-box">
    <h2>👋 환영합니다</h2>
    <input type="email" id="emailInput" placeholder="이메일" />
    <input type="password" id="pwInput" placeholder="비밀번호" />
    <button class="btn" onclick="handleLogin()">로그인</button>
    <button class="btn" style="background: #666; margin-top:5px;" onclick="handleSignup()">회원가입</button>
  </div>

  <div id="mainSection" class="container hidden">
    <div style="text-align: right; margin-bottom: 10px;">
       <span id="userEmail"></span>님 접속 중 <button onclick="handleLogout()">로그아웃</button>
    </div>
    <hr>
    <h3>📜 내 면접 히스토리</h3>
    <div id="historyList">기록을 불러오는 중...</div>
  </div>
</body>
</html>
