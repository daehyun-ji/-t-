<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase 로그인 + AI TTS 음성 변환기</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: Arial, sans-serif;
      color: #333;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
      color: #1a1a2e;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .info {
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 14px;
      background: #edf2f7;
      color: #4a5568;
      font-size: 14px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
      color: #2d3748;
    }

    .option-box {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    select, input {
      height: 44px;
      padding: 0 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      width: 100%;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.5;
      outline: none;
    }

    textarea:focus, select:focus, input:focus {
      border-color: #42a5f5;
      box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15);
    }

    .button-row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button, .download-link {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      height: 46px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
      font-weight: bold;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover, .download-link:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
    }

    .make-btn { background: #42a5f5; color: white; width: 100%; }
    .clear-btn { background: #b0bec5; color: white; }
    .download-link { background: #7e57c2; color: white; }
    .auth-btn { background: #1a1a2e; color: white; width: 100%; margin-bottom: 8px; }

    .hidden { display: none !important; }

    .status {
      min-height: 24px;
      margin-top: 14px;
      color: #e94560;
      font-size: 14px;
      text-align: center;
      font-weight: bold;
    }

    .result-box {
      margin-top: 20px;
      padding: 18px;
      border-radius: 18px;
      background: #f7f9fb;
      border: 1px solid #edf1f5;
    }

    audio { width: 100%; margin-top: 10px; }

    @media (max-width: 700px) {
      .option-box { grid-template-columns: 1fr; }
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // ⚠️ [설정 1] 본인의 Firebase 웹 앱 키값을 정확히 입력하세요!
    const firebaseConfig = {
      apiKey: "AIzaSyDicqUuRCRdxuQQtmLeYPEpOIQAIN7sYZ8",
      authDomain: "bigdata-real.firebaseapp.com",
      projectId: "bigdata-real",
      storageBucket: "bigdata-real.firebasestorage.app",
      messagingSenderId: "207202321481",
      appId: "1:207202321481:web:6b1e8e4aa447599a20eb98"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ⚠️ [설정 2] 방금 새로 배포한 구글 웹 앱 URL (/exec로 끝나는 주소)
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzJZf7td737irvsLbpZ3kf7W6ygJwmUd6arO8w6G8z_ZSCCuuTTbsgWVin9FoP8DYPX/exec';

    // HTML 요소 가져오기
    const authStage = document.getElementById('authStage');
    const mainStage = document.getElementById('mainStage');
    const userBar = document.getElementById('userBar');
    const userEmailSpan = document.getElementById('userEmail');
    
    const emailInput = document.getElementById('emailInput');
    const pwInput = document.getElementById('pwInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    const textInput = document.getElementById('textInput');
    const modelSelect = document.getElementById('modelSelect');
    const voiceSelect = document.getElementById('voiceSelect');
    const speedInput = document.getElementById('speedInput');
    const makeBtn = document.getElementById('makeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusBox = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadLink = document.getElementById('downloadLink');

    // 🔐 [Firebase] 로그인 상태 감지 인증 시스템
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userEmailSpan.textContent = user.email;
        authStage.classList.add('hidden');
        userBar.classList.remove('hidden');
        mainStage.classList.remove('hidden');
      } else {
        authStage.classList.remove('hidden');
        userBar.classList.add('hidden');
        mainStage.classList.add('hidden');
        resultBox.classList.add('hidden');
      }
    });

    // 로그인 기능
    loginBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      try { await signInWithEmailAndPassword(auth, emailInput.value.trim(), pwInput.value.trim()); } 
      catch (err) { alert("로그인 실패: " + err.message); }
    });

    // 회원가입 기능
    signupBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      try { 
        await createUserWithEmailAndPassword(auth, emailInput.value.trim(), pwInput.value.trim()); 
        alert("회원가입 완료! 자동으로 로그인됩니다.");
      } catch (err) { alert("회원가입 실패: " + err.message); }
    });

    // 로그아웃 기능
    logoutBtn.addEventListener('click', () => signOut(auth));

    // 🔊 [TTS] 음성 만들기 기능 연동
    makeBtn.addEventListener('click', makeSpeech);
    clearBtn.addEventListener('click', () => {
      textInput.value = '';
      statusBox.textContent = '';
      audioPlayer.removeAttribute('src');
      resultBox.classList.add('hidden');
    });

    async function makeSpeech() {
      const text = textInput.value.trim();
      const model = modelSelect.value;
      const voice = voiceSelect.value;
      const speed = Number(speedInput.value || 1.0);

      if (!text) return alert('음성으로 변환할 텍스트를 입력해주세요.');
      if (speed < 0.25 || speed > 4.0) return alert('속도는 0.25 ~ 4.0 사이여야 합니다.');

      try {
        makeBtn.disabled = true;
        makeBtn.textContent = '생성 중...';
        resultBox.classList.add('hidden');
        statusBox.textContent = '구글 Apps Script 서버에 요청을 전달하는 중입니다...';

        // 🚨 에러 해결의 핵심: POST 대신 데이터를 안전한 쿼리스트링(GET) 주소로 조립하여 전송합니다.
        const ttsUrl = `${APPS_SCRIPT_URL}?type=tts&model=${model}&voice=${voice}&speed=${speed}&text=${encodeURIComponent(text)}`;
        
        const response = await fetch(ttsUrl);
        const data = await response.json();

        if (data.error) throw new Error(data.error);
        if (!data.audioBase64) throw new Error('음성 인코딩 데이터를 받지 못했습니다.');

        // Base64 데이터를 재생 가능한 오디오 URL로 복원
        const audioUrl = base64ToAudioUrl(data.audioBase64, 'audio/mpeg');
        audioPlayer.src = audioUrl;
        downloadLink.href = audioUrl;
        downloadLink.download = `tts-${Date.now()}.mp3`;
        
        resultBox.classList.remove('hidden');
        statusBox.textContent = '음성 파일 변환 성공!';
      } catch (error) {
        console.error(error);
        statusBox.textContent = '요청 실패';
        alert('오류가 발생했습니다:\n' + error.message);
      } finally {
        makeBtn.disabled = false;
        makeBtn.textContent = '음성 만들기';
      }
    }

    function base64ToAudioUrl(base64, mimeType) {
      const byteCharacters = atob(base64);
      const byteArrays = [];
      for (let offset = 0; offset < byteCharacters.length; offset += 512) {
        const slice = byteCharacters.slice(offset, offset + 512);
        const byteNumbers = new Array(slice.length);
        for (let i = 0; i < slice.length; i++) byteNumbers[i] = slice.charCodeAt(i);
        byteArrays.push(new Uint8Array(byteNumbers));
      }
      return URL.createObjectURL(new Blob(byteArrays, { type: mimeType }));
    }
  </script>
</head>
<body>
  <div class="container">
    <h1>🔊 AI TTS 음성 변환기</h1>
    <div class="subtitle">Firebase 가입 보안 통신 인증 시스템 통합 버전</div>

    <div id="userBar" class="hidden" style="text-align: right; font-size: 13px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee;">
      🔐 <span id="userEmail" style="font-weight: bold; color: #42a5f5;"></span>님 환영합니다. 
      <button id="logoutBtn" style="height:30px; padding:0 10px; font-size:12px; background:#e53935; color:white; border-radius:6px;">로그아웃</button>
    </div>

    <div id="authStage">
      <div class="info">⚠️ 서비스를 이용하려면 이메일 로그인이 필요합니다. 계정이 없다면 회원가입을 먼저 진행하세요.</div>
      <div class="form-group"><label>이메일 주소</label><input type="email" id="emailInput" placeholder="example@email.com"></div>
      <div class="form-group"><label>비밀번호</label><input type="password" id="pwInput" placeholder="6자리 이상 비밀번호"></div>
      <button class="auth-btn" id="loginBtn">로그인하기</button>
      <button class="auth-btn" id="signupBtn" style="background:#555;">신규 회원가입</button>
    </div>

    <div id="mainStage" class="hidden">
      <div class="option-box">
        <select id="modelSelect">
          <option value="tts-1">tts-1 빠른 생성</option>
          <option value="tts-1-hd">tts-1-hd 고품질</option>
        </select>
        <select id="voiceSelect">
          <option value="alloy">alloy (기본)</option>
          <option value="echo">echo</option>
          <option value="fable">fable</option>
          <option value="onyx">onyx (남성)</option>
          <option value="nova">nova (여성)</option>
          <option value="shimmer">shimmer</option>
        </select>
        <input id="speedInput" type="number" min="0.25" max="4.0" step="0.05" value="1.0" />
      </div>

      <div>
        <label>변환할 텍스트 입력</label>
        <textarea id="textInput" placeholder="여기에 적은 문장이 AI 목소리로 변환됩니다."></textarea>
      </div>

      <div class="button-row">
        <button class="clear-btn" id="clearBtn">초기화</button>
        <button class="make-btn" id="makeBtn">음성 만들기</button>
      </div>

      <div id="status" class="status"></div>

      <div id="resultBox" class="result-box hidden">
        <label>🎵 생성된 AI 음성 듣기</label>
        <audio id="audioPlayer" controls></audio>
        <div class="button-row">
          <a id="downloadLink" class="download-link" href="#" download>mp3 파일 다운로드</a>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
