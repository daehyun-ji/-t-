<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 압박 면접관 & 보이스 피드백</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      font-family: 'Malgun Gothic', sans-serif;
      color: #333;
    }

    .container {
      width: min(800px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
      color: #1e3c72;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 24px;
      font-size: 15px;
    }

    /* 화면 전환용 클래스 */
    .hidden { display: none !important; }

    /* 입력 폼 스타일 */
    .form-group {
      margin-bottom: 20px;
    }

    .label {
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
      color: #2a5298;
    }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #1e3c72;
      box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.2);
    }

    /* 버튼 스타일 */
    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      height: 50px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1e3c72;
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    /* 면접 진행 화면 스타일 */
    .chat-box {
      background: #f4f6f9;
      border-radius: 16px;
      padding: 20px;
      min-height: 150px;
      margin-bottom: 20px;
      border-left: 5px solid #1e3c72;
    }

    .ai-question {
      font-size: 17px;
      line-height: 1.6;
      font-weight: bold;
      color: #111;
      margin-bottom: 10px;
    }

    audio { width: 100%; margin-top: 10px; }

    .status {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin: 10px 0;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>👔 AI 압박 면접관</h1>
    <div class="subtitle">목표 기업/대학과 생기부를 기반으로 실전 압박 면접을 진행합니다.</div>

    <div id="setupStage">
      <div class="form-group">
        <label class="label" for="targetInput">1. 지원 목적 (회사명/대학 및 학과/직무)</label>
        <input type="text" id="targetInput" placeholder="예: 한국대학교 컴퓨터공학과 / 네이버 프론트엔드 개발자" />
      </div>

      <div class="form-group">
        <label class="label" for="infoInput">2. 본인의 스펙 및 서류 내용 (생기부, 자소서, 이력서 요약)</label>
        <textarea id="infoInput" placeholder="질문의 뼈대가 될 활동 내용을 적어주세요.&#10;예: 교내 해커톤대회에서 웹 기반 커뮤니티를 제작해 최우수상을 받음. 리액트를 활용한 상태 관리에 익숙함. 독서 활동으로 '인공지능의 미래'를 읽음."></textarea>
      </div>

      <div class="form-group">
        <label class="label" for="voiceSelect">3. 면접관 목소리 선택</label>
        <select id="voiceSelect">
          <option value="onyx">onyx (묵직하고 냉철한 남성 음성)</option>
          <option value="alloy">alloy (신뢰감 주는 중성 음성)</option>
          <option value="nova">nova (차분하고 또박또박한 여성 음성)</option>
          <option value="echo">echo (기본 남성 음성)</option>
        </select>
      </div>

      <button class="btn" id="startBtn">🔥 모의 면접 시작하기</button>
    </div>

    <div id="interviewStage" class="hidden">
      <div class="chat-box">
        <div class="label">📢 AI 면접관 질문</div>
        <div id="questionText" class="ai-question">면접관이 서류를 검토 중입니다. 잠시만 기다려 주세요...</div>
        <audio id="audioPlayer" controls autoplay></audio>
      </div>

      <div class="form-group">
        <label class="label" for="answerInput">✍️ 당신의 답변</label>
        <textarea id="answerInput" placeholder="질문을 잘 듣고 본인의 답변을 타이핑하세요. (Ctrl + Enter로 제출 가능)"></textarea>
      </div>

      <div id="statusBox" class="status"></div>
      <button class="btn" id="submitAnswerBtn">답변 제출하기 (다음 질문)</button>
    </div>

    <div id="resultStage" class="hidden">
      <div class="chat-box" style="border-left-color: #2e7d32;">
        <div class="label" style="color: #2e7d32;">📊 면접 총평 및 피드백</div>
        <div id="feedbackText" style="white-space: pre-line; line-height: 1.6;"></div>
      </div>
      <button class="btn" id="restartBtn" style="background: #555;">다시 처음부터 하기</button>
    </div>

  </div>

  <script>
    // ⚠️ 본인의 구글 앱스 스크립트 웹 앱 URL을 여기에 붙여넣으세요!
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbznRSlWsXbQhqJfTLjnQ0q-0tU1btSa4lv1nPy1uYUO1BRNe2xCO09F5qPLaqOU1om7/exec';

    // DOM 요소 연결
    const setupStage = document.getElementById('setupStage');
    const interviewStage = document.getElementById('interviewStage');
    const resultStage = document.getElementById('resultStage');

    const targetInput = document.getElementById('targetInput');
    const infoInput = document.getElementById('infoInput');
    const voiceSelect = document.getElementById('voiceSelect');
    const startBtn = document.getElementById('startBtn');

    const questionText = document.getElementById('questionText');
    const audioPlayer = document.getElementById('audioPlayer');
    const answerInput = document.getElementById('answerInput');
    const submitAnswerBtn = document.getElementById('submitAnswerBtn');
    const statusBox = document.getElementById('statusBox');
    const feedbackText = document.getElementById('feedbackText');
    const restartBtn = document.getElementById('restartBtn');

    // 변수 선언
    let currentTurn = 1;
    const maxTurn = 3; // 💡 테스트를 위해 질문 수를 3개로 세팅 (원하면 늘리세요)
    let interviewHistory = []; // 대화 기록 보관용
    let userTarget = "";
    let userInfo = "";

    // 이벤트 리스너
    startBtn.addEventListener('click', startInterview);
    submitAnswerBtn.addEventListener('click', nextStep);
    restartBtn.addEventListener('click', () => location.reload());
    answerInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.ctrlKey && !submitAnswerBtn.disabled) nextStep();
    });

    // [Step 1] 면접 시작 절차
    async function startInterview() {
      userTarget = targetInput.value.trim();
      userInfo = infoInput.value.trim();

      if (!userTarget || !userInfo) {
        alert('지원 목적과 서류 내용을 모두 입력해 주세요!');
        return;
      }

      // 화면 전환
      setupStage.classList.add('hidden');
      interviewStage.classList.remove('hidden');

      // AI 면접관 시스템 가이드 구축
      interviewHistory.push({
        role: "system",
        content: `당신은 매우 깐깐하고 날카로운 취업/입시 압박 면접관입니다. 유저의 목표는 "${userTarget}"이며, 제출한 서류 요약본은 "${userInfo}"입니다. 
        이 내용을 바탕으로 현실적이고 허점을 찌르는 압박 질문을 던지세요. 
        한 번에 절대로 여러 질문을 하지 말고 딱 '하나의 질문'만 한 문장 혹은 두 문장 이내로 던지세요. 친절하게 대하지 말고 격식 있고 차갑게 질문하세요.`
      });

      // 첫 번째 질문 생성 요청
      fetchQuestion("첫 번째 질문을 시작해 주세요. 지원 동기나 서류 기반 질문으로 시작하세요.");
    }

    // [Step 2] AI에게 질문 받아오기 (Chat API 사용)
    async function fetchQuestion(promptText) {
      try {
        setLoading(true, '면접관이 질문을 생각하고 있습니다...');
        
        // 1. ChatGPT 연동 (작성하신 GAS 구조상 텍스트를 한꺼번에 묶어서 전송해야 하므로 히스토리를 합쳐서 질문)
        // GAS의 handleChat은 단일 question만 받으므로, 이전 대화를 유기적으로 잇기 위해 프롬프트를 조합합니다.
        let fullConversation = "";
        interviewHistory.forEach(msg => {
          fullConversation += `[${msg.role}]: ${msg.content}\n`;
        });
        fullConversation += `[user]: ${promptText}\n[system]: 다음 단 한 개의 면접 질문을 출력하시오.`;

        const chatResponse = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ type: 'chat', question: fullConversation })
        });
        const chatData = await chatResponse.json();
        
        if (chatData.error) throw new Error(chatData.error);
        const aiQuestion = chatData.answer.trim();

        // 히스토리에 AI 질문 추가
        interviewHistory.push({ role: "assistant", content: aiQuestion });
        questionText.textContent = `[질문 ${currentTurn}/${maxTurn}] ${aiQuestion}`;

        // 2. 받아온 질문을 음성(TTS)으로 변환
        setLoading(true, '면접관이 음성을 출력하는 중입니다...');
        const ttsResponse = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            type: 'tts',
            text: aiQuestion,
            voice: voiceSelect.value,
            model: 'tts-1',
            speed: 0.95 // 약간 느리게 해서 무게감을 줌
          })
        });
        const ttsData = await ttsResponse.json();

        if (ttsData.error) throw new Error(ttsData.error);

        // TTS 오디오 재생
        const audioUrl = base64ToAudioUrl(ttsData.audioBase64, 'audio/mpeg');
        audioPlayer.src = audioUrl;

      } catch (error) {
        alert('오류 발생: ' + error.message);
        console.error(error);
      } finally {
        setLoading(false, '');
      }
    }

    // [Step 3] 답변 제출 및 다음 루프 처리
    async function nextStep() {
      const userAnswer = answerInput.value.trim();
      if (!userAnswer) {
        alert('답변을 입력해 주세요!');
        return;
      }

      interviewHistory.push({ role: "user", content: userAnswer });
      answerInput.value = ''; // 창 비우기

      if (currentTurn < maxTurn) {
        currentTurn++;
        // 다음 압박 질문 요청 (유저의 답변에 대해 꼬리질문을 유도)
        fetchQuestion(`방금 한 답변은 "${userAnswer}" 입니다. 이 답변의 논리적 모순이나 부족한 점을 지적하며 다음 압박 꼬리질문을 1개만 던져주세요.`);
      } else {
        // 지정된 질문 수가 끝나면 평가 리포트 생성
        finishInterview();
      }
    }

    // [Step 4] 면접 종료 및 최종 피드백 보기
    async function finishInterview() {
      try {
        setLoading(true, '모든 면접이 종료되었습니다. AI 면접관이 채점 및 피드백 리포트를 작성 중입니다...');
        interviewStage.classList.add('hidden');
        resultStage.classList.remove('hidden');

        let finalPrompt = "이제 면접이 끝났습니다. 지금까지의 질문과 답변을 바탕으로 종합 평가를 내려주세요.\n";
        finalPrompt += "형식은 다음과 같이 고정해서 출력해 주세요:\n";
        finalPrompt += "[최종 면접 점수: OO점 / 100점]\n\n";
        finalPrompt += "■ 종합 총평:\n(내용)\n\n";
        finalPrompt += "■ 좋았던 답변:\n(내용)\n\n";
        finalPrompt += "■ 아쉬웠던 점 및 보완 방향:\n(내용)";

        let fullConversation = "";
        interviewHistory.forEach(msg => {
          fullConversation += `[${msg.role}]: ${msg.content}\n`;
        });
        fullConversation += `[user]: ${finalPrompt}`;

        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ type: 'chat', question: fullConversation })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error);

        feedbackText.textContent = data.answer;

      } catch (error) {
        alert('피드백 생성 실패: ' + error.message);
      } finally {
        setLoading(false, '');
      }
    }

    // 유틸리티 함수: Base64 -> Audio URL 변환 (기존 코드 재활용)
    function base64ToAudioUrl(base64, mimeType) {
      const byteCharacters = atob(base64);
      const byteArrays = [];
      for (let offset = 0; offset < byteCharacters.length; offset += 512) {
        const slice = byteCharacters.slice(offset, offset + 512);
        const byteNumbers = new Array(slice.length);
        for (let i = 0; i < slice.length; i++) {
          byteNumbers[i] = slice.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        byteArrays.push(byteArray);
      }
      const blob = new Blob(byteArrays, { type: mimeType });
      return URL.createObjectURL(blob);
    }

    // 로딩 제어
    function setLoading(isLoading, message) {
      startBtn.disabled = isLoading;
      submitAnswerBtn.disabled = isLoading;
      statusBox.textContent = message;
    }
  </script>
</body>
</html>
