<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실전 AI 압박 면접 시스템</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ⚠️ [설정 1] 본인의 Firebase 웹 앱 키값을 정확히 넣으세요!
    const firebaseConfig = {
      apiKey: "AIzaSyDicqUuRCRdxuQQtmLeYPEpOIQAIN7sYZ8",
      authDomain: "bigdata-real.firebaseapp.com",
      projectId: "bigdata-real",
      storageBucket: "bigdata-real.firebasestorage.app",
      messagingSenderId: "207202321481",
      appId: "1:207202321481:web:6b1e8e4aa447599a20eb98"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ⚠️ [설정 2] 방금 새로 배포한 구글 웹 앱 URL (/exec로 끝나는 주소)
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby3E4IUDpUOwiiVKFtdKi_fFgJSAJZYo49Tl8smLcPDDbwSy03N2AnEEirSSSvdguFqQA/exec';

    let currentUser = null;
    let interviewHistory = [];
    let currentTurn = 1;
    const maxTurn = 3;
    let userTarget = "";
    let userInfo = "";

    const authStage = document.getElementById('authStage');
    const setupStage = document.getElementById('setupStage');
    const interviewStage = document.getElementById('interviewStage');
    const resultStage = document.getElementById('resultStage');
    const historySection = document.getElementById('historySection');
    const userBar = document.getElementById('userBar');

    const emailInput = document.getElementById('emailInput');
    const pwInput = document.getElementById('pwInput');
    const userEmailSpan = document.getElementById('userEmail');
    const historyList = document.getElementById('historyList');

    const targetInput = document.getElementById('targetInput');
    const infoInput = document.getElementById('infoInput');
    const startBtn = document.getElementById('startBtn');

    const questionText = document.getElementById('questionText');
    const audioPlayer = document.getElementById('audioPlayer');
    const answerInput = document.getElementById('answerInput');
    const submitAnswerBtn = document.getElementById('submitAnswerBtn');
    const statusBox = document.getElementById('statusBox');
    const feedbackText = document.getElementById('feedbackText');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userEmailSpan.textContent = user.email;
        authStage.classList.add('hidden');
        userBar.classList.remove('hidden');
        setupStage.classList.remove('hidden');
        historySection.classList.remove('hidden');
        loadHistory();
      } else {
        currentUser = null;
        authStage.classList.remove('hidden');
        userBar.classList.add('hidden');
        setupStage.classList.add('hidden');
        interviewStage.classList.add('hidden');
        resultStage.classList.add('hidden');
        historySection.classList.add('hidden');
      }
    });

    document.getElementById('loginBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      try { await signInWithEmailAndPassword(auth, emailInput.value.trim(), pwInput.value.trim()); } 
      catch (err) { alert("로그인 실패: " + err.message); }
    });

    document.getElementById('signupBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      try { 
        await createUserWithEmailAndPassword(auth, emailInput.value.trim(), pwInput.value.trim()); 
        alert("가입 완료!");
      } catch (err) { alert("회원가입 실패: " + err.message); }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
    document.getElementById('restartBtn').addEventListener('click', () => location.reload());

    startBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      userTarget = targetInput.value.trim();
      userInfo = infoInput.value.trim();

      if (!userTarget || !userInfo) {
        alert('내용을 모두 입력하세요!');
        return;
      }

      setupStage.classList.add('hidden');
      historySection.classList.add('hidden');
      interviewStage.classList.remove('hidden');

      interviewHistory.push({
        role: "system",
        content: `당신은 면접관입니다. 목표:${userTarget}, 서류:${userInfo}. 날카로운 질문을 단 한 개만 존댓말로 던지세요.`
      });

      fetchQuestion("첫 번째 질문을 시작해 주세요.");
    });

    async function fetchQuestion(promptText) {
      try {
        setLoading(true, '면접관이 다음 질문을 고르고 있습니다...');
        
        let fullConversation = "";
        interviewHistory.forEach(msg => { fullConversation += `[${msg.role}]: ${msg.content}\n`; });
        fullConversation += `[user]: ${promptText}`;

        // 🚨 쿼리스트링 규격을 정확히 맞춘 URL 조립
        const chatUrl = `${APPS_SCRIPT_URL}?type=chat&question=${encodeURIComponent(fullConversation)}`;
        const chatResponse = await fetch(chatUrl);
        const chatData = await chatResponse.json();
        
        if (chatData.error) throw new Error(chatData.error);
        const aiQuestion = chatData.answer.trim();

        interviewHistory.push({ role: "assistant", content: aiQuestion });
        questionText.textContent = `[질문 ${currentTurn}/${maxTurn}] ${aiQuestion}`;

        setLoading(true, '면접관이 질문을 말하고 있습니다...');
        const ttsUrl = `${APPS_SCRIPT_URL}?type=tts&text=${encodeURIComponent(aiQuestion)}`;
        const ttsResponse = await fetch(ttsUrl);
        const ttsData = await ttsResponse.json();
        
        if (ttsData.error) throw new Error(ttsData.error);
        audioPlayer.src = base64ToAudioUrl(ttsData.audioBase64, 'audio/mpeg');

      } catch (error) {
        alert('오류 발생: ' + error.message);
      } finally {
        setLoading(false, '');
      }
    }

    submitAnswerBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      const userAnswer = answerInput.value.trim();
      if (!userAnswer) return alert('답변을 입력하세요!');

      interviewHistory.push({ role: "user", content: userAnswer });
      answerInput.value = ''; 

      if (currentTurn < maxTurn) {
        currentTurn++;
        fetchQuestion(`지원자의 답변: "${userAnswer}". 이 답변의 허점을 찌르는 다음 질문을 1개만 하세요.`);
      } else {
        finishInterview();
      }
    });

    async function finishInterview() {
      try {
        setLoading(true, '최종 점수를 매기는 중입니다...');
        interviewStage.classList.add('hidden');
        resultStage.classList.remove('hidden');

        let finalPrompt = "면접이 끝났습니다. [최종 면접 점수: OO점 / 100점] 형식과 총평을 작성하세요.";
        let fullConversation = "";
        interviewHistory.forEach(msg => { fullConversation += `[${msg.role}]: ${msg.content}\n`; });
        fullConversation += `[user]: ${finalPrompt}`;

        const finalUrl = `${APPS_SCRIPT_URL}?type=chat&question=${encodeURIComponent(fullConversation)}`;
        const response = await fetch(finalUrl);
        const data = await response.json();
        if (data.error) throw new Error(data.error);

        feedbackText.textContent = data.answer;

        await addDoc(collection(db, "interviews"), {
          uid: currentUser.uid,
          target: userTarget,
          feedback: data.answer,
          score: extractScore(data.answer),
          timestamp: new Date()
        });

      } catch (error) {
        alert('저장 실패: ' + error.message);
      } finally {
        setLoading(false, '');
      }
    }

    function base64ToAudioUrl(base64, mimeType) {
      const byteCharacters = atob(base64);
      const byteArrays = [];
      for (let offset = 0; offset < byteCharacters.length; offset += 512) {
        const slice = byteCharacters.slice(offset, offset + 512);
        const byteNumbers = new Array(slice.length);
        for (let i = 0; i < slice.length; i++) byteNumbers[i] = slice.charCodeAt(i);
        byteArrays.push(new Uint8Array(byteNumbers));
      }
      return URL.createObjectURL(new Blob(byteArrays, { type: mimeType }));
    }

    function extractScore(text) {
      const match = text.match(/점수:\s*(\d+)/);
      return match ? parseInt(match[1]) : 0;
    }

    async function loadHistory() {
      try {
        const q = query(collection(db, "interviews"), where("uid", "==", currentUser.uid), orderBy("timestamp", "desc"));
        const querySnapshot = await getDocs(q);
        historyList.innerHTML = '';
        if(querySnapshot.empty) {
          historyList.innerHTML = '<p style="color:#999; text-align:center;">기록이 없습니다.</p>';
          return;
        }
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const date = data.timestamp ? data.timestamp.toDate().toLocaleDateString() : '-';
          const item = document.createElement('div');
          item.className = 'history-item';
          item.innerHTML = `<strong>[${date}] ${data.target}</strong> <span class="score-badge">${data.score}점</span><br><p style="margin-top:5px; font-size:13px; color:#555;">${data.feedback.substring(0, 120)}...</p>`;
          historyList.appendChild(item);
        });
      } catch (e) { console.error(e); }
    }

    function setLoading(isLoading, message) {
      startBtn.disabled = isLoading;
      submitAnswerBtn.disabled = isLoading;
      statusBox.textContent = message;
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #1a1a2e; font-family: sans-serif; color: #333; padding: 20px 0; }
    .container { width: min(700px, 94%); margin: 20px auto; background: #fff; border-radius: 15px; padding: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
    h1 { color: #1a1a2e; text-align: center; margin-top: 0; }
    .hidden { display: none !important; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; color: #1a1a2e; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; outline: none; }
    textarea { min-height: 100px; }
    .btn { width: 100%; border: none; border-radius: 8px; height: 45px; font-size: 15px; font-weight: bold; cursor: pointer; background: #1a1a2e; color: white; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .chat-box { background: #f4f4f6; border-radius: 10px; padding: 15px; margin-bottom: 15px; border-left: 5px solid #1a1a2e; }
    .ai-question { font-size: 15px; font-weight: bold; margin-bottom: 10px; }
    audio { width: 100%; }
    .status { text-align: center; color: #e94560; font-size: 14px; margin: 10px 0; min-height: 20px; font-weight: bold; }
    .history-box { margin-top: 20px; padding-top: 15px; border-top: 2px dashed #ddd; }
    .history-item { padding: 10px; background: #f9f9f9; border: 1px solid #eee; border-radius: 6px; margin-bottom: 6px; }
    .score-badge { background: #e8f5e9; color: #2e7d32; padding: 2px 6px; border-radius: 5px; font-weight: bold; font-size: 12px; float: right; }
  </style>
</head>
<body>
  <div class="container">
    <h1>👔 실전 AI 압박 면접관</h1>
    <div id="userBar" class="hidden" style="text-align: right; font-size: 13px; margin-bottom: 10px;">
      <span id="userEmail" style="font-weight: bold;"></span>님 <button id="logoutBtn">로그아웃</button>
    </div>
    <div id="authStage">
      <div class="form-group"><label>이메일</label><input type="email" id="emailInput"></div>
      <div class="form-group"><label>비밀번호</label><input type="password" id="pwInput"></div>
      <button class="btn" id="loginBtn">로그인</button>
      <button class="btn" id="signupBtn" style="background:#555; margin-top:5px;">회원가입</button>
    </div>
    <div id="setupStage" class="hidden">
      <div class="form-group"><label>희망 직무</label><input type="text" id="targetInput" placeholder="예: 개발자" /></div>
      <div class="form-group"><label>서류 요약</label><textarea id="infoInput"></textarea></div>
      <button class="btn" id="startBtn">면접 시작</button>
    </div>
    <div id="interviewStage" class="hidden">
      <div class="chat-box">
        <div id="questionText" class="ai-question">대기 중...</div>
        <audio id="audioPlayer" controls autoplay></audio>
      </div>
      <div class="form-group"><label>당신의 답변</label><textarea id="answerInput"></textarea></div>
      <div id="statusBox" class="status"></div>
      <button class="btn" id="submitAnswerBtn">답변 제출</button>
    </div>
    <div id="resultStage" class="hidden">
      <div class="chat-box"><label>📊 피드백 리포트</label><div id="feedbackText" style="white-space: pre-line; margin-top:5px;"></div></div>
      <button class="btn" id="restartBtn" style="background:#555;">처음으로</button>
    </div>
    <div id="historySection" class="history-box hidden">
      <h3>📜 누적 연습 기록</h3>
      <div id="historyList"></div>
    </div>
  </div>
</body>
</html>
